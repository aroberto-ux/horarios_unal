# ============================================================
#  Publicación en GitHub Pages
#
#  SOLO hace falta si pones Settings > Pages > Source = "GitHub
#  Actions". Existe porque los pushes hechos con el GITHUB_TOKEN
#  NO disparan workflows, y en el modo "Deploy from a branch" el
#  que reconstruye el sitio es precisamente un workflow
#  (pages-build-deployment). Resultado: el bot commitea, pero la
#  página servida se queda congelada.
#
#  Este workflow se lanza a mano, por cron de respaldo, y sobre
#  todo desde el bucle de snapshots vía workflow_dispatch (que sí
#  funciona con el GITHUB_TOKEN). Para eso pon DESPLEGAR_PAGES: "1"
#  en snapshot_cupos.yml.
#
#  Alternativa sin este archivo: deja Pages en "Deploy from a
#  branch" y crea un PAT de grano fino (solo este repo, permiso
#  Contents: Read and write) guardado como secreto PAT_PUSH. Al
#  empujar con un PAT, Pages sí reconstruye.
# ============================================================
name: Publicar en Pages

on:
  workflow_dispatch:
  schedule:
    # Red de seguridad: si el bucle no alcanzó a lanzarlo.
    - cron: "8,38 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sia_scraper.py importa selenium al cargarse, aunque generar_series_json
      # y generar_estadisticas no lo usen para nada. Sin esto el import falla
      # y el sitio no se despliega.
      - name: Instalar dependencias
        run: pip install selenium

      # series.json y estadisticas.html ya no están en el repo (versionarlos
      # eran ~1,7 MB de blob nuevo cada 30 min). Se construyen aquí, que es
      # el único sitio que de verdad los necesita.
      - name: Reconstruir los derivados
        run: |
          python -c "import sia_scraper as s; s.generar_series_json(); s.generar_estadisticas()"

      - name: Armar el sitio
        run: |
          mkdir -p _sitio
          for f in index.html horario.html estadisticas.html series.json \
                   horarios.csv grupos.csv catalogo.json; do
            [ -e "$f" ] && cp "$f" _sitio/ || true
          done
          # Solo los últimos 5 días del historial: servirlo entero son
          # decenas de MB por visita, y Pages tiene un tope de tráfico.
          # Quien quiera la serie completa que clone el repo.
          if [ -d historial ]; then
            mkdir -p _sitio/historial
            ls historial/*.csv | tail -5 | xargs -I{} cp {} _sitio/historial/
          fi
          ls -lh _sitio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
