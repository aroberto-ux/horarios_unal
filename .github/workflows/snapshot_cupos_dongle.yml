name: Snapshot de cupos (vía IP residencial - dongle Tailscale)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg unzip xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          CHROME_VERSION=$(google-chrome-stable --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          chmod +x /usr/local/bin/chromedriver

      - name: Setup virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "CHROME_BIN=/usr/bin/google-chrome-stable" >> $GITHUB_ENV

      # A partir de aquí SÍ enrutamos por el dongle: solo el tráfico del
      # scraper hacia el SIA necesita salir por IP residencial. Todo lo de
      # arriba (apt, descarga de Chrome) ya usó la red rápida de GitHub.
      - name: Conectar a la tailnet
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Enrutar la salida por el dongle (exit node)
        env:
          EXIT_NODE: ${{ secrets.TS_EXIT_NODE_IP }}
        run: |
          sudo tailscale set --exit-node=100.115.208.79 --exit-node-allow-lan-access=false
          sleep 5
          echo "IP de salida actual (debería ser la de tu casa):"
          curl -s https://ifconfig.me
          echo

      # Sin inyección de proxy: Tailscale ya enruta todo el tráfico del
      # runner (incluido el de Chrome/Selenium) por el dongle.
      - name: Run scraper
        run: |
          python sia_scraper.py cupos
        env:
          PYTHONUNBUFFERED: "1"
          SIA_GUARDAR_TEXTO: "0"
          DISPLAY: ":99"

      - name: Check if snapshot succeeded
        id: check
        run: |
          if [ -f "catalogo.json" ] && [ "$(stat -c %Y catalogo.json)" -gt "$(date -d '30 minutes ago' +%s)" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.success == 'true'
        run: |
          git config user.name "sia-bot"
          git config user.email "sia-bot@users.noreply.github.com"
          git add catalogo.json grupos.csv horarios.csv horario.html series.json runs.csv historial/
          git commit -m "snapshot de cupos $(date -u '+%Y-%m-%d %H:%M') UTC (vía dongle)" || echo "No hay cambios"
          git push
