# Corre la suite del parser en cada cambio. No necesita Chrome ni red: los
# tests trabajan sobre los textos crudos ya archivados en textos/*.jsonl.gz.
# selenium se instala solo porque sia_scraper.py lo importa al cargarse.
#
# CAMBIO: antes se listaba lo que había que IGNORAR, y cada archivo nuevo que
# tocaba el bot (bucle.json, horarios.csv, catalogo.json...) volvía a disparar
# CI. Ahora se lista lo que sí debe dispararlo. Importa sobre todo si empiezas
# a empujar con un PAT: con el GITHUB_TOKEN los pushes del bot no disparan
# workflows, pero con un PAT sí, y serían ~50 corridas de CI al día.
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "sia_scraper.py"
      - "sia_libre.py"
      - "historial.py"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install selenium pytest

      # test_libre.py usa pytest.importorskip, que ante un ImportError SALTA
      # el archivo en vez de fallar: si a sia_libre.py le faltara una
      # dependencia en el runner, CI saldría verde sin haber probado nada.
      # Esto lo comprueba de frente.
      - name: Comprobar que los módulos importan
        run: python -c "import historial, sia_scraper, sia_libre; print('los 3 módulos importan')"

      - name: Correr los tests
        run: python -m pytest tests/ -q

      # Sin esto, un pytest que salte TODO por dependencias ausentes pasaría
      # por bueno. Se exige un mínimo de tests realmente ejecutados.
      - name: Que no se haya saltado media suite
        run: |
          python -m pytest tests/ -q --tb=no | tee /tmp/salida.txt
          python - <<'EOF'
          import re, pathlib, sys
          txt = pathlib.Path("/tmp/salida.txt").read_text()
          m = re.search(r"(\d+) passed", txt)
          n = int(m.group(1)) if m else 0
          print(f"tests ejecutados: {n}")
          if n < 80:
              sys.exit(f"solo {n} tests pasaron; se esperaban al menos 80")
          EOF

      - name: Comprobar que series.json se regenera sin errores
        run: |
          python sia_scraper.py stats
          python - <<'EOF'
          import json, pathlib
          d = json.loads(pathlib.Path("series.json").read_text(encoding="utf-8"))
          assert d["series"], "series.json quedó vacío"
          print(f"OK: {len(d['series'])} series, {d['n_snapshots']} snapshots")
          EOF

      - name: No dejar sucio el árbol
        run: git diff --stat
