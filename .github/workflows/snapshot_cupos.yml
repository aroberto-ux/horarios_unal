name: Snapshot de cupos

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg unzip xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          CHROME_VERSION=$(google-chrome-stable --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          chmod +x /usr/local/bin/chromedriver

      - name: Get working proxy
        id: proxy
        run: |
          # Descarga lista de proxies HTTP públicos
          PROXY_LIST=$(curl -s https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000&country=all&ssl=all&anonymity=all)
          echo "$PROXY_LIST" > proxies.txt
          # Toma el primer proxy que responda
          for proxy in $(head -10 proxies.txt); do
            if curl -s -x http://$proxy -I https://sia.unal.edu.co --max-time 5 | grep -q "HTTP/"; then
              echo "proxy=$proxy" >> $GITHUB_OUTPUT
              break
            fi
          done

      - name: Inject proxy into scraper (runtime only)
        if: steps.proxy.outputs.proxy != ''
        run: |
          PROXY="${{ steps.proxy.outputs.proxy }}"
          # Agrega opciones de proxy al archivo sia_scraper.py (solo para esta ejecución)
          sed -i "/options.add_argument('--no-sandbox')/a \ \ \ \ options.add_argument('--proxy-server=http://$PROXY')" sia_scraper.py
          echo "Proxy inyectado: $PROXY"

      - name: Setup virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "CHROME_BIN=/usr/bin/google-chrome-stable" >> $GITHUB_ENV

      - name: Run scraper
        run: |
          python sia_scraper.py cupos
        env:
          PYTHONUNBUFFERED: "1"
          SIA_GUARDAR_TEXTO: "0"
          DISPLAY: ":99"

      - name: Check if snapshot succeeded
        id: check
        run: |
          if [ -f "catalogo.json" ] && [ "$(stat -c %Y catalogo.json)" -gt "$(date -d '30 minutes ago' +%s)" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.success == 'true'
        run: |
          git config user.name "sia-bot"
          git config user.email "sia-bot@users.noreply.github.com"
          git add catalogo.json grupos.csv horarios.csv horario.html series.json runs.csv historial/
          git commit -m "snapshot de cupos $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "No hay cambios"
          git push
