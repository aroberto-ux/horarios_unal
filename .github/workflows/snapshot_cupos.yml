name: Snapshot de cupos

on:
  schedule:
    - cron: '*/30 * * * *'  # cada 30 minutos
  workflow_dispatch:  # permite ejecución manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser xvfb dbus-x11
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV

      - name: Setup virtual display
        run: |
          sudo service dbus start
          Xvfb :99 -ac -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run scraper with stealth
        run: |
          python sia_scraper.py cupos
        env:
          PYTHONUNBUFFERED: "1"
          SIA_GUARDAR_TEXTO: "0"

      - name: Check if snapshot succeeded
        id: check
        run: |
          if [ -f "catalogo.json" ] && [ "$(stat -c %Y catalogo.json)" -gt "$(date -d '30 minutes ago' +%s)" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "⚠️ El snapshot no se generó correctamente"
          fi

      - name: Commit and push changes
        if: steps.check.outputs.success == 'true'
        run: |
          git config user.name "sia-bot"
          git config user.email "sia-bot@users.noreply.github.com"
          git add catalogo.json grupos.csv horarios.csv horario.html series.json runs.csv historial/
          git commit -m "snapshot de cupos $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "No hay cambios"
          git push

      - name: Send alert on failure
        if: steps.check.outputs.success != 'true'
        run: |
          echo "⚠️ El workflow falló. Verifica el SIA."
          # Descomenta si tienes Telegram configurado
          # curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT }}/sendMessage \
          #   -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          #   -d "text=⚠️ SIA bloqueó Actions en $(date -u '+%Y-%m-%d %H:%M UTC')"
