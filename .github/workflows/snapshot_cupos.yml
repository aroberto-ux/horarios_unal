# ============================================================
#  Snapshot automático de cupos del SIA en GitHub Actions
#
#  ¿DÓNDE QUEDAN LOS DATOS? En el repositorio mismo. Cada
#  corrida hace un commit con los archivos actualizados, así
#  que el repo es tu base de datos Y su historial de versiones.
#
#  Cómo usarlo:
#   1. Crea un repositorio en github.com
#      >>> HAZLO PÚBLICO <<< (ver nota de minutos abajo)
#   2. Sube sia_scraper.py a la raíz del repositorio
#   3. Guarda este archivo como .github/workflows/snapshot_cupos.yml
#   4. En Settings > Actions > General > Workflow permissions,
#      marca "Read and write permissions"
#   5. (Opcional) Settings > Pages > Source: "Deploy from a branch",
#      rama main, carpeta / (root). Así verás tus estadísticas en
#      https://TU-USUARIO.github.io/TU-REPO/estadisticas.html
#
#  NOTA SOBRE MINUTOS:
#   Con UNA corrida diaria (~12 min) el consumo es de unos
#   360 minutos al mes, así que cabe de sobra incluso en un
#   repositorio privado (límite gratuito: 2.000 min/mes).
#   Los repositorios públicos tienen Actions ilimitadas.
#   Si más adelante subes la frecuencia a cada 4 horas o menos,
#   pásalo a público para no chocar con el límite.
# ============================================================
name: Snapshot de cupos SIA

on:
  schedule:
    # ── 8:15 p. m. hora de Colombia, todos los días ──
    # El cron de GitHub va en UTC y Colombia es UTC-5, así que
    # 20:15 COT = 01:15 UTC DEL DÍA SIGUIENTE.
    # Por eso los commits aparecerán fechados un día después en UTC:
    # es normal, corresponde a la noche anterior en Colombia.
    #
    #        ┌─ minuto (15)
    #        │  ┌─ hora UTC (1 = 01:15 UTC = 20:15 Colombia)
    #        │  │ ┌─ día del mes (todos)
    #        │  │ │ ┌─ mes (todos)
    #        │  │ │ │ ┌─ día de la semana (todos)
    - cron: "15 * * * *"
    #
    # Otras opciones (recuerda: hora Colombia + 5 = UTC)
    #   - cron: "15 1,13 * * *"   # 8:15 p.m. y 8:15 a.m.
    #   - cron: "0 */2 * * *"     # cada 2 h (semana de inscripciones)
    # OJO: no bajes de cada 1-2 horas por respeto al servidor del SIA.

  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install selenium
        # Chrome ya viene instalado en ubuntu-latest y Selenium 4.6+
        # descarga el chromedriver correcto automáticamente.

      - name: Tomar el snapshot de cupos
        run: python sia_scraper.py cupos

      - name: Guardar los resultados como commit
        run: |
          git config user.name "sia-bot"
          git config user.email "sia-bot@users.noreply.github.com"
          git add -A cupos_historial.csv estadisticas.html catalogo.json \
                     grupos.csv horarios.csv horario.html || true
          git commit -m "snapshot de cupos $(date -u +'%Y-%m-%d %H:%M UTC')" \
            || echo "Sin cambios que guardar"
          git push
