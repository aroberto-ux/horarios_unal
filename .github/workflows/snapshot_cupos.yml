name: Snapshot de cupos

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Install Chrome (stable, not snap) and ChromeDriver
        run: |
          # Eliminar Chromium snap que causa problemas
          sudo apt-get remove -y chromium-browser || true
          sudo snap remove chromium || true
          
          # Instalar Chrome estable
          sudo apt-get update
          sudo apt-get install -y wget gnupg unzip
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb
          
          # Instalar ChromeDriver compatible
          CHROME_VERSION=$(google-chrome-stable --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          echo "Chrome version: $CHROME_VERSION"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Setup virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "CHROME_BIN=/usr/bin/google-chrome-stable" >> $GITHUB_ENV

      - name: Run scraper
        run: |
          python sia_scraper.py cupos
        env:
          PYTHONUNBUFFERED: "1"
          SIA_GUARDAR_TEXTO: "0"
          DISPLAY: ":99"
          CHROME_BIN: "/usr/bin/google-chrome-stable"

      - name: Check if snapshot succeeded
        id: check
        run: |
          if [ -f "catalogo.json" ] && [ "$(stat -c %Y catalogo.json)" -gt "$(date -d '30 minutes ago' +%s)" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.success == 'true'
        run: |
          git config user.name "sia-bot"
          git config user.email "sia-bot@users.noreply.github.com"
          git add catalogo.json grupos.csv horarios.csv horario.html series.json runs.csv historial/
          git commit -m "snapshot de cupos $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "No hay cambios"
          git push
