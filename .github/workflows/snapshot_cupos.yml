# ============================================================
#  Snapshot de cupos del SIA — versión "bucle largo"
#
#  POR QUÉ ES ASÍ: el cron de GitHub Actions es "mejor esfuerzo".
#  En la práctica se atrasa 0-30 min y descarta ~la mitad de los
#  disparos. En vez de pelear con él, aquí el cron solo actúa como
#  VIGILANTE: si no hay un bucle vivo, arranca uno. El bucle vive
#  hasta 5h30m y toma un snapshot cada INTERVALO_MIN por su cuenta,
#  con reloj propio y exacto.
#
#  Resultado: la precisión temporal ya no depende del scheduler de
#  GitHub, solo de que el vigilante acierte una vez cada 5 horas.
#
#  Requiere: Settings > Actions > General > Workflow permissions:
#  "Read and write permissions".
# ============================================================
name: Snapshot de cupos SIA

on:
  schedule:
    # Vigilante cada 15 min. Da igual que GitHub se salte la mayoría:
    # solo hace falta que acierte UNO cada ~5h30m.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

# NO usar 'concurrency': cancela las corridas PENDIENTES, que es
# justo lo que hacía perder snapshots. El control de duplicados
# ahora lo hace el paso "vigilante" de abajo.

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # tope de GitHub: 360
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Vigilante — ¿ya hay un bucle vivo?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si hay varias corridas activas, solo sobrevive la más
          # antigua (id más bajo). Determinista: sin carreras.
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" \
                  --workflow snapshot_cupos.yml \
                  --status in_progress \
                  --json databaseId --jq 'map(.databaseId) | min')
          echo "corrida más antigua activa: $ids / yo soy: $GITHUB_RUN_ID"
          if [ -n "$ids" ] && [ "$ids" != "$GITHUB_RUN_ID" ]; then
            echo "Ya hay un bucle vivo. Salgo sin hacer nada."
            echo "seguir=no" >> $GITHUB_OUTPUT
          else
            echo "seguir=si" >> $GITHUB_OUTPUT
          fi

      - name: Instalar Python
        if: steps.guard.outputs.seguir == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.guard.outputs.seguir == 'si'
        run: pip install selenium

      - name: Bucle de snapshots
        if: steps.guard.outputs.seguir == 'si'
        env:
          SIA_GUARDAR_TEXTO: "1"   # pon "0" fuera de la semana crítica
          INTERVALO_MIN: "30"      # cada cuánto tomar una medición
          DURACION_MIN: "330"      # 5h30m; deja margen antes del tope
        run: |
          set -u
          git config user.name  "sia-bot"
          git config user.email "sia-bot@users.noreply.github.com"

          proteger_derivados() {
            contar() { tail -n +2 "$1" 2>/dev/null | cut -d, -f1 | sort -u | wc -l; }
            nuevas=$(contar horarios.csv)
            previas=$(git show HEAD:horarios.csv 2>/dev/null | tail -n +2 | cut -d, -f1 | sort -u | wc -l)
            echo "Materias: antes=$previas, ahora=$nuevas"
            if [ "$previas" -gt 0 ] && [ $((nuevas * 10)) -lt $((previas * 8)) ]; then
              echo "::warning::Raspado incompleto ($nuevas de $previas). Restauro derivados; el historial conserva la fila parcial."
              git checkout -- horarios.csv grupos.csv catalogo.json estadisticas.html horario.html 2>/dev/null || true
            fi
          }

          guardar() {
            for f in cupos_historial*.csv runs.csv estadisticas.html \
                     catalogo.json grupos.csv horarios.csv horario.html; do
              [ -e "$f" ] && git add "$f"
            done
            [ -d textos ] && git add textos
            git commit -m "snapshot de cupos $(date -u +'%Y-%m-%d %H:%M UTC')" \
              || { echo "Sin cambios que guardar"; return 0; }
            for intento in 1 2 3; do
              git push && return 0
              echo "Push rechazado ($intento/3); rebase y reintento..."
              git pull --rebase --autostash || true
              sleep 10
            done
            echo "::error::No se pudo hacer push tras 3 intentos"
            return 1
          }

          fin=$(( $(date +%s) + DURACION_MIN * 60 ))
          n=0
          while [ "$(date +%s)" -lt "$fin" ]; do
            n=$((n + 1))
            t0=$(date +%s)
            echo "===== barrido #$n — $(date -u +'%H:%M UTC') ====="

            # timeout duro: si el SIA se cuelga, no se lleva el bucle
            timeout --signal=TERM $((INTERVALO_MIN * 60 - 240)) \
              python sia_scraper.py cupos \
              || echo "::warning::barrido #$n falló o se agotó (código $?)"

            proteger_derivados
            guardar || true

            resto=$(( INTERVALO_MIN * 60 - ($(date +%s) - t0) ))
            if [ "$resto" -gt 0 ] && [ "$(date +%s)" -lt "$fin" ]; then
              echo "Durmiendo $((resto / 60)) min hasta el próximo barrido"
              sleep "$resto"
            fi
          done
          echo "Bucle terminado tras $n barridos."

      # Opcional: encadena la siguiente corrida sin esperar al cron.
      # Requiere un PAT de grano fino (solo este repo, Actions: write)
      # guardado como secreto PAT_DISPATCH. Sin él, este paso se salta
      # y el vigilante retoma en <=15 min.
      - name: Encadenar la siguiente corrida
        if: steps.guard.outputs.seguir == 'si' && always()
        env:
          GH_TOKEN: ${{ secrets.PAT_DISPATCH }}
        run: |
          [ -z "${GH_TOKEN:-}" ] && { echo "Sin PAT_DISPATCH; lo retoma el cron vigilante."; exit 0; }
          gh workflow run snapshot_cupos.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Siguiente bucle lanzado."
